name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kit-tests:
    name: BEMBELKit tests (swift test, native macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Toolchain versions
        run: swift --version && xcodebuild -version
      - name: Format check (swift-format, bundled with Xcode)
        run: make format-check
      - name: Test
        run: swift test --package-path Packages/BEMBELKit

  app-build:
    name: App build (iOS Simulator, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Secrets from template (no real values in CI)
        run: cp Config/Secrets.xcconfig.template Config/Secrets.xcconfig
      - name: Build
        run: |
          xcodebuild -project BEMBEL.xcodeproj -scheme BEMBEL \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
