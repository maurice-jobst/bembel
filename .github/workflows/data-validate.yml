name: Data validation

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "Packages/BEMBELKit/Sources/BEMBELKit/Resources/**"
      - ".github/workflows/data-validate.yml"
  # No paths filter on pull_request: this is a required status check, and a
  # required check that never reports leaves every unrelated PR pinned on
  # "expected" forever. validate_data.py is stdlib and runs in a second, so
  # paying for it on a docs-only PR is cheaper than the deadlock.
  pull_request:

jobs:
  validate:
    name: Schema validation (stdlib only, no pip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validator self-tests
        run: make test-data
      - name: Validate the curated data
        run: make validate
