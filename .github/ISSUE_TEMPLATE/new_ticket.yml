name: New backlog ticket
description: Propose a new BEM-XXX ticket
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Check the scope of record in `docs/PRODUCT.md` first (ADR 0010): if it
        is not a v1.0 feature it is a milestone-M4 side quest or out of scope,
        and epic S is capped until v1.0 ships — a new data source needs an
        entry in `data/sources.json` before any ticket. Once accepted, this
        gets a `BEM-XXX` id, the labels, and a row in the BACKLOG.md epic index.
  - type: textarea
    id: what
    attributes:
      label: What and why
    validations:
      required: true
  - type: textarea
    id: ac
    attributes:
      label: Acceptance criteria
      placeholder: How would you know this is done?
  - type: dropdown
    id: epic
    attributes:
      label: Epic
      options:
        - "A — Foundation"
        - "B — Data pipeline"
        - "C — Departures"
        - "D — Sonnenstand / LoD2 geometry"
        - "E — Free drinking water"
        - "F — Rain radar"
        - "G — Stadtzustand"
        - "H — Ship"
        - "S — Side quests (M4, capped until v1.0)"
        - New epic / v1.1+
  - type: dropdown
    id: size
    attributes:
      label: Rough size
      options: ["S", "M", "L"]
