name: New backlog ticket
description: Propose a new BEM-XXX ticket
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Check the locked scope in `docs/BACKLOG.md` (ADR 0010) first — if it
        is not a v1.0 feature it is probably a milestone-M4 side quest or out
        of scope; epic S is capped until v1.0 ships. Once accepted, this gets
        a `BEM-XXX` id, the labels, and a row in the BACKLOG.md epic index.
  - type: textarea
    id: what
    attributes:
      label: What and why
    validations:
      required: true
  - type: textarea
    id: ac
    attributes:
      label: Acceptance criteria
      placeholder: How would you know this is done?
  - type: dropdown
    id: epic
    attributes:
      label: Epic
      options:
        - "A — Foundation"
        - "B — Data pipeline"
        - "C — Departures"
        - "D — Schattenkarte"
        - "E — Free drinking water"
        - "F — Rain radar"
        - "G — Stadtzustand"
        - "H — Ship"
        - New epic / v1.1+
  - type: dropdown
    id: size
    attributes:
      label: Rough size
      options: ["S", "M", "L"]
